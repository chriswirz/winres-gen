name: build-and-publish

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The version is computed once and consumed by every later job, so the
  # artifact names and the release tag cannot drift apart. v0.1.<run number,
  # four digits>: monotonic, sortable, and it says which run produced a binary
  # without consulting anything.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      number: ${{ steps.compute.outputs.number }}
    steps:
      - id: compute
        run: |
          number="$(printf '%04d' "${{ github.run_number }}")"
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "version=0.1.${number}" >> "$GITHUB_OUTPUT"
          echo "building v0.1.${number}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # build.sh test is the same gofmt/vet/test gate developers run locally,
      # so CI and the checkout cannot drift apart.
      - name: Format, vet and test
        run: bash ./build.sh test

      # winres-gen has no unit tests yet, so a smoke run is what actually
      # proves the tool works rather than merely compiles: generate an icon and
      # the .syso resources from a throwaway PNG and check both landed.
      - name: Smoke test
        run: |
          bash ./build.sh build
          python3 -c "
          import struct, zlib
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c))
          px = b''.join(b'\x00' + bytes([(x * 4) % 256, 128, 200, 255]) * 64 for x in range(64))
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', 64, 64, 8, 6, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(px))
                 + chunk(b'IEND', b''))
          open('logo.png', 'wb').write(png)
          "
          ./winres-gen -mode crop -sizes 16,32,48,256 -version 1.2.3.4 logo.png
          ls -l *.ico *.syso
          test -s logo.ico

  build:
    needs: [version, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="winres-gen-${GOOS}-${GOARCH}${{ matrix.ext }}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/${name}" .
      - uses: actions/upload-artifact@v4
        with:
          name: winres-gen-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # Linux packages, built from the binaries the matrix above produced. The
  # .rpm is what dnf/yum install; the .deb covers apt-based distributions.
  package:
    needs: [version, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: winres-gen-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build .rpm and .deb
        env:
          ARCH: ${{ matrix.arch }}
          PKG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp "dist/winres-gen-linux-${ARCH}" packaging/winres-gen
          chmod +x packaging/winres-gen
          mkdir -p out
          nfpm package -f packaging/nfpm.yaml -p rpm -t out/
          nfpm package -f packaging/nfpm.yaml -p deb -t out/
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: winres-gen-packages-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, build, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staging
      - name: Collect binaries
        run: |
          mkdir -p dist
          find staging -type f -exec mv {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS
          ls -l
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "winres-gen v${VERSION}" \
            --notes "Automated build of \`${{ github.sha }}\` from \`${{ github.ref_name }}\`." \
            --latest
